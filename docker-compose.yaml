services:
  # --- Consensus for Patroni. Single node for local dev;
  # TODO prod: 3-node etcd cluster.
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: always
    ports:
      - "2379:2379"
    environment:
      ETCD_NAME: etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - piercemq

  # --- One-shot: fresh named volumes are root-owned, but the PG image
  # runs as postgres. Fix ownership before any PG node starts.
  pg-perms:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.patroni
    user: root
    command: ["chown", "-R", "postgres:postgres", "/v/leader", "/v/sync", "/v/async", "/v/backup", "/v/repo"]
    volumes:
      - pgdata-leader:/v/leader
      - pgdata-sync:/v/sync
      - pgdata-async:/v/async
      - pgdata-backup:/v/backup
      - pgbackrest-repo:/v/repo
    restart: "no"
    networks:
      - piercemq

  # --- Patroni scope `piercemq`: 1 leader + 1 sync standby + 1 async
  # offload replica + 1 async backup/DR replica. Same image; per-node
  # identity via PATRONI_* env (overlaid onto the mounted yml at startup),
  # role tags via the mounted patroni-*.yml file.
  pg-leader:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.patroni
    hostname: pg-leader
    restart: always
    ports:
      - "8008:8008" # Patroni REST (debugging / patronictl)
    environment:
      PATRONI_NAME: pg-leader
      PATRONI_SCOPE: piercemq
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-leader:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-leader:8008
    volumes:
      - pgdata-leader:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./docker/patroni/patroni-base.yml:/etc/patroni/patroni.yml:ro
      - ./docker/patroni/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      pg-perms:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8008/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piercemq

  pg-sync:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.patroni
    hostname: pg-sync
    restart: always
    ports:
      - "8009:8008"
    environment:
      PATRONI_NAME: pg-sync
      PATRONI_SCOPE: piercemq
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-sync:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-sync:8008
    volumes:
      - pgdata-sync:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./docker/patroni/patroni-base.yml:/etc/patroni/patroni.yml:ro
      - ./docker/patroni/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      pg-perms:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      pg-leader:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8008/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piercemq

  # Async replica for read offload (tags in patroni-async.yml: nosync).
  pg-async:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.patroni
    hostname: pg-async
    restart: always
    ports:
      - "8010:8008"
    environment:
      PATRONI_NAME: pg-async
      PATRONI_SCOPE: piercemq
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-async:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-async:8008
    volumes:
      - pgdata-async:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./docker/patroni/patroni-async.yml:/etc/patroni/patroni.yml:ro
      - ./docker/patroni/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      pg-perms:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      pg-leader:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8008/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piercemq

  # DR replica + pgBackRest repo owner (tags in patroni-backup.yml:
  # nosync + noloadbalance, so HAProxy excludes it from the read pool).
  # Full backup: docker compose exec pg-backup pgbackrest --stanza=piercemq backup
  pg-backup:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.patroni
    hostname: pg-backup
    restart: always
    ports:
      - "8011:8008"
    environment:
      PATRONI_NAME: pg-backup
      PATRONI_SCOPE: piercemq
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-backup:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-backup:8008
    volumes:
      - pgdata-backup:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./docker/patroni/patroni-backup.yml:/etc/patroni/patroni.yml:ro
      - ./docker/patroni/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      pg-perms:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      pg-leader:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8008/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piercemq

  # --- One-shot: create the admin role + piercemq db + pgBackRest stanza
  # once the leader is up. Idempotent (IF NOT EXISTS / createdb /
  # stanza-create tolerate re-runs). The role step duplicates bootstrap
  # `users:` on purpose: if initdb already ran without it, this still
  # guarantees the role exists. $$ escapes survive compose interpolation
  # (single-quoted strings are interpolated too), reaching sh as single $.
  db-init:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.patroni
    user: postgres
    command:
      - sh
      - -c
      - 'until curl -sf http://pg-leader:8008/primary >/dev/null; do echo waiting-for-primary; sleep 2; done; export PGPASSWORD="$$POSTGRES_PASSWORD"; psql -h pg-leader -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = ''admin''" | grep -q 1 || psql -h pg-leader -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE admin LOGIN CREATEDB PASSWORD ''$$APP_DB_PASSWORD''"; createdb -h pg-leader -U postgres -O admin piercemq || true; pgbackrest --stanza=piercemq --no-online stanza-create || true'
    environment:
      POSTGRES_PASSWORD: admin
      APP_DB_PASSWORD: admin
    volumes:
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./docker/patroni/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      pg-leader:
        condition: service_healthy
    restart: "no"
    networks:
      - piercemq

  # --- One-shot: apply embedded schema migrations (migrations/*.sql
  # via `api migrate up`) against the WRITE pool once the db exists.
  # Single runner by design: api replicas never migrate, so there is no
  # concurrent-migrate race. Fails the container on error so a bad
  # migration blocks api boot instead of serving without schema.
  db-migrate:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api
    command: ["migrate", "up"]
    environment:
      DB_URL: postgres://admin:admin@pgbouncer:6432/piercemq?sslmode=disable
    depends_on:
      db-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    restart: "no"
    networks:
      - piercemq

  # --- Stable endpoints across failover. pg-rw follows the primary,
  # pg-ro round-robins healthy replicas (pg-backup excluded by noloadbalance).
  haproxy:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.haproxy
    restart: always
    ports:
      - "5432:5432" # pg-rw (primary) - local psql/debugging
      - "5433:5433" # pg-ro (replicas) - local psql/debugging
      - "8404:8404" # stats page
    depends_on:
      pg-leader:
        condition: service_healthy
      pg-sync:
        condition: service_healthy
      pg-async:
        condition: service_healthy
      pg-backup:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8404/stats || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - piercemq

  # --- Connection pooling in transaction mode.
  # piercemq    -> pg-rw (writes, sync-replicated on commit)
  # piercemq_ro -> pg-ro (reads, async replicas)
  pgbouncer:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.pgbouncer
    restart: always
    ports:
      - "6432:6432"
    depends_on:
      haproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U admin -d piercemq || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piercemq

  redis:
    image: redis:alpine3.22
    restart: always
    ports:
      - "6379:6379"
    # §10.3: noeviction — silent data loss from eviction is worse than
    # backpressure (writes fail fast when maxmemory is hit instead of
    # dropping queued jobs). MAXLEN caps per stream are applied by the
    # producers; this is the backstop.
    command: redis-server --requirepass 123456890ca --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456890ca", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - piercemq

  # --- Async replica for Sentinel failover (§11.3.2). Delivery buffer only:
  # async replication may lose the last ms of stream entries on promotion;
  # the reaper sweep recovers them from PostgreSQL.
  redis-replica:
    image: redis:alpine3.22
    restart: always
    command: redis-server --requirepass 123456890ca --masterauth 123456890ca --replicaof redis 6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456890ca", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - piercemq

  # --- Redis Sentinel x3 (§11.3.2, §12.2): quorum 2 declares ODOWN and
  # promotes the replica. Services opt into Sentinel transport with
  # REDIS_SENTINELS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
  # (REDIS_MASTER defaults to mymaster); default stays direct REDIS_ADDR
  # until the failover path burns in. Ports published for host-side
  # verification: redis-cli -p 26379 sentinel get-master-addr-by-name mymaster
  redis-sentinel-1:
    image: redis:alpine3.22
    restart: always
    # The source conf stays :ro; sentinel rewrites its config on state
    # changes, so boot from a copy in writable /tmp.
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./docker/sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - "26379:26379"
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      - piercemq

  redis-sentinel-2:
    image: redis:alpine3.22
    restart: always
    # The source conf stays :ro; sentinel rewrites its config on state
    # changes, so boot from a copy in writable /tmp.
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./docker/sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - "26380:26379"
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      - piercemq

  redis-sentinel-3:
    image: redis:alpine3.22
    restart: always
    # The source conf stays :ro; sentinel rewrites its config on state
    # changes, so boot from a copy in writable /tmp.
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./docker/sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - "26381:26379"
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      - piercemq
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - piercemq
    #develop:
    #  watch:
    #    - action: sync
    #      path: .
    #      target: ./

  # --- Local SMTP sink for worker email jobs. MailHog catches everything
  # sent via SMTP_HOST=mailhog:1025; browse at http://localhost:8025.
  # Production: point SMTP_HOST/PORT/USER/PASS at a real relay instead.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    networks:
      - piercemq

  # --- Local S3-compatible store for worker file jobs (S3_ENDPOINT).
  # Console at http://localhost:9001 (minioadmin/minioadmin).
  # Chainguard's image (MinIO stopped publishing to Docker Hub/Quay):
  # :latest-dev variant because the distroless runtime has no shell and
  # the healthcheck needs one (wget below). Prod would use the runtime
  # image with an external check instead. Free tier ships :latest only
  # (unpinned); pin by digest if that ever matters.
  minio:
    image: chainguard/minio:latest-dev
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - piercemq

  # --- One-shot: create the conventional `piercemq` bucket once MinIO is
  # up. File jobs address buckets directly (s3://bucket/key) and PUT to a
  # missing bucket fails, so this must complete before workers start.
  # Uses the same -dev image: it bundles mc + sh (minio-client has mc
  # but no shell, so two chained mc calls are impossible there).
  minio-init:
    image: chainguard/minio:latest-dev
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing local/piercemq'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - piercemq

  workers:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      REDIS_ADDR: redis://:123456890ca@redis:6379/0
      DB_URL: postgres://admin:admin@pgbouncer:6432/piercemq?sslmode=disable
      DB_READ_URL: postgres://admin:admin@pgbouncer:6432/piercemq_ro?sslmode=disable
      # Email goes to MailHog locally; set EMAIL_DRY_RUN=1 to skip sending.
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: piercemq@localhost
      # File jobs: sandboxed local dir + MinIO as the S3-compatible target.
      FILE_BASE_DIR: /tmp/piercemq-files
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      # Exec jobs: empty = deny-all. Add binaries deliberately, e.g. "ls,ffmpeg".
      EXEC_ALLOWLIST: ""
      EXEC_WORKDIR: /tmp/piercemq-exec
    restart: always
    networks:
      - piercemq
    #develop:
    #  watch:
    #    - action: sync
    #      path: .
    #      target: ./

  # --- Scheduler: promotes due scheduled jobs (scheduled_at <= now()) from
  # PostgreSQL to the Redis streams every SCHED_POLL_SEC. Stateless and
  # horizontally safe (SKIP LOCKED claiming); restart resumes from DB state.
  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.scheduler
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      REDIS_ADDR: redis://:123456890ca@redis:6379/0
      DB_URL: postgres://admin:admin@pgbouncer:6432/piercemq?sslmode=disable
      DB_READ_URL: postgres://admin:admin@pgbouncer:6432/piercemq_ro?sslmode=disable
      SCHED_POLL_SEC: "10"
      SCHED_BATCH: "100"
      RETENTION_DAYS: "4"
      RETENTION_POLL_SEC: "3600"
      RETENTION_BATCH: "1000"
    restart: always
    networks:
      - piercemq

  # --- Reaper: reclaims crashed-worker running jobs past the heartbeat
  # timeout and re-dispatches stale pending jobs whose XADD never landed
  # (§12.2-12.3). Own process by design: a crashed worker pool cannot run
  # its own reaper. Stateless and horizontally safe (SKIP LOCKED).
  reaper:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.reaper
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      REDIS_ADDR: redis://:123456890ca@redis:6379/0
      DB_URL: postgres://admin:admin@pgbouncer:6432/piercemq?sslmode=disable
      DB_READ_URL: postgres://admin:admin@pgbouncer:6432/piercemq_ro?sslmode=disable
      REAPER_POLL_SEC: "30"
      REAPER_BATCH: "100"
      REAPER_STALE_SEC: "90"
      REAPER_SWEEP_AFTER_SEC: "60"
    restart: always
    networks:
      - piercemq

  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      REDIS_ADDR: redis://:123456890ca@redis:6379/0
      DB_URL: postgres://admin:admin@pgbouncer:6432/piercemq?sslmode=disable
      DB_READ_URL: postgres://admin:admin@pgbouncer:6432/piercemq_ro?sslmode=disable
      ENV: development
      PORT: "8000"
      JWT_SECRET: "dev-only-change-me"
      JWT_TTL_HOURS: "24"
      RATE_LIMIT_RPS: "20"
      RATE_LIMIT_BURST: "40"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - piercemq
    #develop:
    #  watch:
    #    - action: sync
    #      path: .
    #      target: ./

volumes:
  pgdata-leader:
  pgdata-sync:
  pgdata-async:
  pgdata-backup:
  pgbackrest-repo:
  etcd-data:
  redisdata:
  miniodata:

networks:
  piercemq:
