; PgBouncer in front of HAProxy -> Patroni.
; pool_mode=transaction: server connections are returned to the pool after
; each transaction, so the Go server must NOT rely on connection-level state
; (no long-lived PREPARE, no SET, no temp tables, no LISTEN/NOTIFY, no advisory
; locks). Plain Query/Exec via database/sql is safe.
[databases]
; writes -> HAProxy pg-rw -> current Patroni primary (leader, sync-replicated)
piercemq = host=haproxy port=5432 dbname=piercemq
; reads -> HAProxy pg-ro -> healthy async replicas (pg-backup excluded via noloadbalance)
piercemq_ro = host=haproxy port=5433 dbname=piercemq

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 30
server_lifetime = 3600
server_connect_timeout = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0

; transaction mode + prepared statements: keep server-side prepares off.
; (Go side uses pgx stdlib without long-lived Prepare; see internal/storage.)
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0

stats_period = 60
admin_users = admin
