# Patroni config for pg-backup (DR replica + pgBackRest repo owner).
# Identical to patroni-base.yml except the tags: block below.
# noloadbalance makes Patroni answer 503 on /replica, so HAProxy
# excludes this node from the read pool. Mounted read-only;
# per-node identity via PATRONI_* env vars.
scope: piercemq
namespace: /service/
name: pg-node # placeholder, always overridden via PATRONI_NAME

restapi:
  listen: 0.0.0.0:8008
  connect_address: pg-node:8008 # overridden via PATRONI_RESTAPI_CONNECT_ADDRESS

etcd3:
  hosts: etcd:2379
  protocol: http

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        archive_mode: "on"
        archive_command: 'pgbackrest --stanza=piercemq archive-push %p'
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator all md5
    - host all all all md5
  users:
    admin:
      password: admin # dev default; keep alphanumeric
      options:
        - createdb
        - login

postgresql:
  listen: 0.0.0.0:5432
  connect_address: pg-node:5432 # overridden via PATRONI_POSTGRESQL_CONNECT_ADDRESS
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/local/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: admin # dev default; override via PATRONI_REPLICATION_PASSWORD
    superuser:
      username: postgres
      password: admin # dev default; override via PATRONI_SUPERUSER_PASSWORD
  parameters:
    archive_mode: "on"
    archive_command: 'pgbackrest --stanza=piercemq archive-push %p'
  pg_hba:
    - host replication replicator all md5
    - host all all all md5

tags:
  nosync: true
  noloadbalance: true
