# Static pgBackRest config, identical on all PG nodes (mounted read-only).
# The repo lives on the shared pgbackrest-repo volume, so archive-push
# from any node lands in the same repo. pg1-path matches the Patroni
# data_dir in patroni-*.yml.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
process-max=2
log-level-console=info
log-level-file=warn

[piercemq]
pg1-path=/var/lib/postgresql/data/pgdata
