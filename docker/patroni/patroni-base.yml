# Shared Patroni config for pg-leader + pg-sync (default tags).
# Mounted read-only into the containers; per-node identity comes from
# PATRONI_* env vars in docker-compose.yaml, which Patroni overlays onto
# this file at startup (see patroni docs/ENVIRONMENT.rst).
# Keep in sync with patroni-async.yml / patroni-backup.yml: the only
# difference between the three files is the tags: block below.
scope: piercemq
namespace: /service/
name: pg-node # placeholder, always overridden via PATRONI_NAME

restapi:
  listen: 0.0.0.0:8008
  connect_address: pg-node:8008 # overridden via PATRONI_RESTAPI_CONNECT_ADDRESS

etcd:
  hosts: etcd:2379
  protocol: http

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        archive_mode: "on"
        archive_command: 'pgbackrest --stanza=piercemq archive-push %p'
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator all md5
    - host all all all md5
  users:
    admin:
      password: admin # dev default; keep alphanumeric
      options:
        - createdb
        - login

postgresql:
  listen: 0.0.0.0:5432
  connect_address: pg-node:5432 # overridden via PATRONI_POSTGRESQL_CONNECT_ADDRESS
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/local/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: admin # dev default; override via PATRONI_REPLICATION_PASSWORD
    superuser:
      username: postgres
      password: admin # dev default; override via PATRONI_SUPERUSER_PASSWORD
  parameters:
    archive_mode: "on"
    archive_command: 'pgbackrest --stanza=piercemq archive-push %p'
  pg_hba:
    - host replication replicator all md5
    - host all all all md5

tags:
  nosync: false
  noloadbalance: false
