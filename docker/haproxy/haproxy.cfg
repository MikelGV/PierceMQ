# HAProxy in front of the Patroni cluster.
# Routes follow failover automatically via Patroni REST health checks:
#   pg-rw (5432) -> current primary  (GET /primary must return 200)
#   pg-ro (5433) -> healthy replicas (GET /replica must return 200)
# pg-backup sets noloadbalance, so Patroni answers 503 on /replica and
# HAProxy excludes it from the read pool automatically.
global
  log stdout format raw local0
  stats socket /tmp/haproxy.sock mode 660 level admin
  stats timeout 30s

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout check 5s
  default-server inter 2s rise 2 fall 2

listen pg-rw
  bind *:5432
  option httpchk GET /primary
  http-check expect status 200
  server pg-leader pg-leader:5432 check port 8008
  server pg-sync pg-sync:5432 check port 8008
  server pg-async pg-async:5432 check port 8008
  server pg-backup pg-backup:5432 check port 8008

listen pg-ro
  bind *:5433
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  server pg-leader pg-leader:5432 check port 8008
  server pg-sync pg-sync:5432 check port 8008
  server pg-async pg-async:5432 check port 8008
  server pg-backup pg-backup:5432 check port 8008

listen stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 10s
