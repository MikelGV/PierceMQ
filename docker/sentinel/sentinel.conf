# PierceMQ Redis Sentinel config (§11.3.2). All three sentinels share this
# file: they discover each other through the master's pub/sub channel, so no
# per-instance config is needed. Quorum 2 of 3 declares ODOWN; failover
# promotes the replica in ~5-15s. Auth: sentinels auth to the data nodes
# with auth-pass; sentinel-to-sentinel auth is unset (no requirepass here).
port 26379
dir /tmp
# Redis 7+ resolves monitor hostnames only with these flags; without them
# 'sentinel monitor mymaster redis ...' is a fatal startup error.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor mymaster redis 6379 2
sentinel auth-pass mymaster 123456890ca
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 15000
sentinel parallel-syncs mymaster 1
